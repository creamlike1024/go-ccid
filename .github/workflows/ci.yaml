name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...

  # usbfs and the ioctl encodings of each architecture, which only build
  # for Linux and Android.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet every Linux architecture and Android
        run: |
          for t in linux/386 linux/arm linux/arm64 linux/riscv64 linux/loong64 linux/s390x linux/ppc64 linux/ppc64le linux/mips linux/mipsle linux/mips64 linux/mips64le android/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fuzz each parser for a while
        run: |
          for f in FuzzParseATR FuzzFindInterfaces FuzzMessage FuzzParseCommand FuzzDecodeT1; do
            go test -run '^$' -fuzz "^$f\$" -fuzztime 30s .
          done
